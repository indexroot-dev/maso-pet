<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="420" viewBox="0 0 420 420">
  <!-- Fondo de la portada: siluetas de mascotas suaves sobre blanco. Se repite como mosaico. -->
  <defs>
    <!-- Gato sentado -->
    <symbol id="gato" viewBox="0 0 100 100">
      <circle cx="50" cy="35" r="16"/>
      <polygon points="35,30 37,9 49,21"/>
      <polygon points="51,21 63,9 65,30"/>
      <path d="M30 96 C24 70 32 47 50 44 C68 47 76 70 70 96 Z"/>
      <path d="M68 93 C88 93 93 76 84 64" fill="none" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <!-- Perro sentado, mirando a la derecha -->
    <symbol id="perro" viewBox="0 0 100 100">
      <circle cx="62" cy="30" r="14"/>
      <ellipse cx="79" cy="36" rx="11" ry="7"/>
      <ellipse cx="52" cy="35" rx="6" ry="13" transform="rotate(15 52 35)"/>
      <polygon points="50,38 72,38 64,62 40,56"/>
      <ellipse cx="44" cy="70" rx="20" ry="22"/>
      <rect x="54" y="54" width="10" height="42" rx="5"/>
      <ellipse cx="36" cy="88" rx="19" ry="9"/>
      <path d="M26 72 C13 66 11 54 15 45" fill="none" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <!-- Conejo -->
    <symbol id="conejo" viewBox="0 0 100 100">
      <ellipse cx="54" cy="22" rx="5" ry="16" transform="rotate(-12 54 22)"/>
      <ellipse cx="66" cy="23" rx="5" ry="16" transform="rotate(14 66 23)"/>
      <circle cx="60" cy="46" r="13"/>
      <ellipse cx="48" cy="74" rx="24" ry="20"/>
      <circle cx="25" cy="80" r="7"/>
      <ellipse cx="62" cy="93" rx="13" ry="5"/>
    </symbol>
    <!-- Huella -->
    <symbol id="huella" viewBox="0 0 100 100">
      <ellipse cx="50" cy="66" rx="19" ry="16"/>
      <ellipse cx="27" cy="44" rx="8" ry="10" transform="rotate(-20 27 44)"/>
      <ellipse cx="42" cy="29" rx="8" ry="11" transform="rotate(-6 42 29)"/>
      <ellipse cx="58" cy="29" rx="8" ry="11" transform="rotate(6 58 29)"/>
      <ellipse cx="73" cy="44" rx="8" ry="10" transform="rotate(20 73 44)"/>
    </symbol>
    <!-- Hueso -->
    <symbol id="hueso" viewBox="0 0 100 100">
      <rect x="24" y="43" width="52" height="14" rx="3"/>
      <circle cx="24" cy="41" r="10"/>
      <circle cx="24" cy="59" r="10"/>
      <circle cx="76" cy="41" r="10"/>
      <circle cx="76" cy="59" r="10"/>
    </symbol>
    <!-- Pez -->
    <symbol id="pez" viewBox="0 0 100 100">
      <ellipse cx="45" cy="50" rx="28" ry="16"/>
      <polygon points="66,50 90,34 90,66"/>
    </symbol>
  </defs>

  <g fill="#e3f1ef" stroke="#e3f1ef">
    <use xlink:href="#perro"  x="10"  y="14"  width="96" height="96"/>
    <use xlink:href="#huella" x="150" y="20"  width="46" height="46" transform="rotate(18 173 43)"/>
    <use xlink:href="#gato"   x="250" y="30"  width="88" height="88"/>
    <use xlink:href="#hueso"  x="356" y="120" width="54" height="54" transform="rotate(-30 383 147)"/>
    <use xlink:href="#conejo" x="130" y="130" width="84" height="84"/>
    <use xlink:href="#pez"    x="30"  y="165" width="58" height="58" transform="rotate(-12 59 194)"/>
    <use xlink:href="#huella" x="260" y="190" width="40" height="40" transform="rotate(-22 280 210)"/>
    <use xlink:href="#gato"   x="20"  y="290" width="80" height="80" transform="scale(-1 1) translate(-120 0)"/>
    <use xlink:href="#hueso"  x="140" y="300" width="50" height="50" transform="rotate(25 165 325)"/>
    <use xlink:href="#perro"  x="230" y="290" width="104" height="104" transform="scale(-1 1) translate(-564 0)"/>
    <use xlink:href="#huella" x="360" y="300" width="40" height="40" transform="rotate(10 380 320)"/>
  </g>
</svg>
